apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
  namespace: djshopping
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopfront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopfront
    spec:
      containers:
        - name: shopfront
          image: ajaypasili/shopfront:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: PRODUCT_CATALOGUE_URI
              value: http://productcatalogue:8020
            - name: STOCK_MANAGER_URI
              value: http://stockmanager:8030
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopfront
  namespace: djshopping
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shopfront
  ports:
    - name: http
      port: 8010
      targetPort: http
