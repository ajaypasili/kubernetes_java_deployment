apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockmanager
  namespace: djshopping
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stockmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockmanager
    spec:
      containers:
        - name: stockmanager
          image: ajaypasili/stockmanager:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8030

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stockmanager
  namespace: djshopping
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stockmanager
  ports:
    - name: http
      port: 8030
      targetPort: http
